name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [main, development]
    # labeled/unlabeled: the label review:single switches the review app to the
    # self-hosting mode (BAZARPRO_MODE=single) and back
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

# One run per PR/branch/tag. A new push to a PR cancels the outdated run; the
# 'closed' event waits for a running review deploy instead of racing it.
# Label changes get their own group, so they never cancel a running test run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  REGISTRY_URL: ghcr.io
  # Constructs the image name based on the repository path (e.g., ghcr.io/user/repo)
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}

jobs:
  lint:
    if: github.event.action != 'closed' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    if: github.event.action != 'closed' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -b

  ansible-check:
    if: github.event.action != 'closed' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Ansible Lint and Syntax Check
        run: |
          uvx --from ansible-core ansible-galaxy collection install -r ansible/requirements.yml
          uvx ansible-lint ansible/site.yml
          uvx --from ansible-core ansible-playbook -i ansible/inventory ansible/site.yml --syntax-check

  test:
    if: github.event.action != 'closed' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run test -- --run --coverage --reporter=junit --outputFile=junit.xml
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # The Rust backend: formatting, lints and its tests against a real Postgres
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bazarpro
          POSTGRES_PASSWORD: bazarpro
          POSTGRES_DB: bazarpro
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U bazarpro" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://bazarpro:bazarpro@127.0.0.1:5432/bazarpro
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Against the backend of this commit and a throwaway database on the runner;
  # Playwright builds and starts the backend (playwright.config.ts)
  e2e-test:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bazarpro
          POSTGRES_PASSWORD: bazarpro
          POSTGRES_DB: bazarpro_e2e
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U bazarpro" --health-interval 2s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://bazarpro:bazarpro@127.0.0.1:5432/bazarpro_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build the backend
        run: cargo build --manifest-path backend/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox
      - name: Install Playwright system dependencies
        run: npx playwright install-deps ${{ github.base_ref == 'main' && 'chromium firefox' || 'chromium' }}
      - name: Run Playwright tests
        env:
          # Firefox doubles the E2E runtime; run it only for release PRs into main
          PLAYWRIGHT_FIREFOX: ${{ github.base_ref == 'main' }}
        run: npx playwright test --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # Images only for review apps and releases. Branch pushes just validate; the
  # release tag builds the image that gets deployed and moves `latest`.
  build-image:
    # After green tests, or for a review:single label change (the review app is
    # rebuilt from the current head without running the tests again)
    if: >-
      always() && (
        (github.event_name == 'pull_request' && github.event.action != 'closed' &&
          (((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'review:single') || needs.test.result == 'success' && needs.backend-test.result == 'success')) ||
        (startsWith(github.ref, 'refs/tags/') && needs.test.result == 'success' && needs.backend-test.result == 'success'))
    needs: [test, backend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase REGISTRY_IMAGE
        run: echo "REGISTRY_IMAGE=$(echo ${{ env.REGISTRY_IMAGE }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Image Metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "latest=false" >> $GITHUB_OUTPUT
            echo "version=PR-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "site_url=https://review-${{ github.event.pull_request.number }}.${{ secrets.DOMAIN_NAME }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "latest=true" >> $GITHUB_OUTPUT
            echo "version=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "site_url=https://${{ secrets.DOMAIN_NAME }}" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.latest == 'true' && format('{0}:latest', env.REGISTRY_IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The prerendered marketing pages read from the live site (BACKEND_URL)
          build-args: |
            BACKEND_URL=https://${{ secrets.DOMAIN_NAME }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
            VITE_PLAUSIBLE_API_HOST=${{ vars.VITE_PLAUSIBLE_API_HOST || secrets.VITE_PLAUSIBLE_API_HOST }}
            VITE_SITE_URL=${{ steps.meta.outputs.site_url }}
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
      # Backend for production, review apps and self-hosters (docker-compose.selfhost.yml)
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}/backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.latest == 'true' && format('{0}/backend:latest', env.REGISTRY_IMAGE) || '' }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-image
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase REGISTRY_IMAGE
        run: echo "REGISTRY_IMAGE=$(echo ${{ env.REGISTRY_IMAGE }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Install Ansible
        run: pip install ansible
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy to Production
        env:
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME || secrets.DOMAIN_NAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          AUTH_SMTP_HOST: ${{ vars.AUTH_SMTP_HOST || secrets.AUTH_SMTP_HOST }}
          AUTH_SMTP_PORT: ${{ vars.AUTH_SMTP_PORT || secrets.AUTH_SMTP_PORT }}
          AUTH_SMTP_USER: ${{ vars.AUTH_SMTP_USER || secrets.AUTH_SMTP_USER }}
          AUTH_SMTP_PASS: ${{ secrets.AUTH_SMTP_PASS }}
          AUTH_SMTP_SECURE: ${{ vars.AUTH_SMTP_SECURE || secrets.AUTH_SMTP_SECURE }}
          AUTH_SMTP_STARTTLS: ${{ vars.AUTH_SMTP_STARTTLS || secrets.AUTH_SMTP_STARTTLS }}
          AUTH_SMTP_EHLO_HOST: ${{ vars.AUTH_SMTP_EHLO_HOST || secrets.AUTH_SMTP_EHLO_HOST }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM || secrets.AUTH_EMAIL_FROM }}
          AUTH_GITHUB_ID: ${{ vars.AUTH_GITHUB_ID || secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_ID: ${{ vars.AUTH_GOOGLE_ID || secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ansible-playbook -i ansible/inventory ansible/site.yml --tags "deploy" \
            -e "ansible_host=${{ secrets.SSH_HOST }} \
                ansible_port=${{ secrets.SSH_PORT || 22 }} \
                ansible_user=${{ secrets.SSH_USER }} \
                IMAGE_TAG=$TAG_NAME \
                REGISTRY_URL=${{ env.REGISTRY_URL }} \
                REGISTRY_IMAGE=${{ env.REGISTRY_IMAGE }} \
                REGISTRY_USER=${{ github.actor }} \
                REGISTRY_PASSWORD=${{ secrets.GITHUB_TOKEN }}"

  deploy-review:
    if: >-
      always() && github.event_name == 'pull_request' && github.event.action != 'closed' &&
      needs.build-image.result == 'success' &&
      (needs.e2e-test.result == 'success' || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'review:single'))
    needs: [e2e-test, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: read
    # Shows "View deployment" in the pull request
    environment:
      name: review
      url: https://review-${{ github.event.pull_request.number }}.${{ vars.DOMAIN_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase REGISTRY_IMAGE
        run: echo "REGISTRY_IMAGE=$(echo ${{ env.REGISTRY_IMAGE }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Install Ansible
        run: pip install ansible
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      # The current labels, not those of the triggering event: a label change and a
      # push can overlap, and the last deploy must still use the right mode
      - name: Instance mode from the review:single label
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/labels" \
            -q '.[].name' | grep -qx 'review:single'; then
            echo "mode=single" >> "$GITHUB_OUTPUT"
          else
            echo "mode=platform" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Review App
        env:
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          REVIEW_MAIL_PASSWORD: ${{ secrets.REVIEW_MAIL_PASSWORD }}
        run: |
          export SUBDOMAIN="review-${{ github.event.pull_request.number }}"
          export PR_ID="${{ github.event.pull_request.number }}"
          export IMAGE_TAG="${{ github.sha }}"
          ansible-playbook -i ansible/inventory ansible/site.yml --tags "review" \
            -e "ansible_host=${{ secrets.SSH_HOST }} \
                ansible_port=${{ secrets.SSH_PORT || 22 }} \
                ansible_user=${{ secrets.SSH_USER }} \
                SUBDOMAIN=$SUBDOMAIN \
                PR_ID=$PR_ID \
                IMAGE_TAG=$IMAGE_TAG \
                BAZARPRO_MODE=${{ steps.mode.outputs.mode }} \
                REGISTRY_URL=${{ env.REGISTRY_URL }} \
                REGISTRY_IMAGE=${{ env.REGISTRY_IMAGE }} \
                REGISTRY_USER=${{ github.actor }} \
                REGISTRY_PASSWORD=${{ secrets.GITHUB_TOKEN }}"
      - name: Comment review app URL on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: https://review-${{ github.event.pull_request.number }}.${{ vars.DOMAIN_NAME }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = single ]; then
            MODE_TEXT="Modus: **single** (Self-Hosting, ein Verein). Zurück zur Plattform: Label \`review:single\` entfernen."
          else
            MODE_TEXT="Modus: **platform** (wie bazarpro.de). Self-Hosting testen: Label \`review:single\` setzen."
          fi
          MARKER='<!-- review-app -->'
          BODY="$MARKER
          ### 🚀 Review-App

          **$URL**

          $MODE_TEXT

          Stand: \`${SHA::7}\` · Demo-Daten aus dem Seed, alle Konten mit Passwort \`123456\`:

          | Rolle | Konto |
          | --- | --- |
          | Admin | \`admin@bazarpro.de\` |
          | Veranstalter | \`user1@bazarpro.de\` |
          | Verkäufer | \`seller@bazarpro.de\` |
          | Käufer | \`kaeufer1@bazarpro.de\`, \`kaeufer2@bazarpro.de\` |

          Laufendes Event mit allen Funktionen: **Fahrradbörse Bürgerhalle (alle Funktionen)**.

          📬 Alle Mails der Review-App: **https://review-$PR-mail.${{ vars.DOMAIN_NAME }}** (Benutzer \`review\`, Passwort aus dem Secret \`REVIEW_MAIL_PASSWORD\`)

          Die Review-App wird beim Schließen des Pull Requests entfernt."
          # Update the existing comment instead of adding one per push
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi

  cleanup-review:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: pip install ansible
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Remove Review App
        run: |
          export SUBDOMAIN="review-${{ github.event.pull_request.number }}"
          export PR_ID="${{ github.event.pull_request.number }}"
          ansible-playbook -i ansible/inventory ansible/site.yml --tags "review" \
            -e "ansible_host=${{ secrets.SSH_HOST }} \
                ansible_port=${{ secrets.SSH_PORT || 22 }} \
                ansible_user=${{ secrets.SSH_USER }} \
                SUBDOMAIN=$SUBDOMAIN \
                PR_ID=$PR_ID \
                review_state=absent"

  release:
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF#refs/tags/}" --repo "${{ github.repository }}" --verify-tag --generate-notes
