name: CI/CD Pipeline

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]
  workflow_dispatch:

env:
  REGISTRY_URL: ghcr.io
  # Constructs the image name based on the repository path (e.g., ghcr.io/user/repo)
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc -b

  ansible-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Ansible Lint and Syntax Check
        run: |
          uvx --from ansible-core ansible-galaxy collection install -r ansible/requirements.yml
          uvx ansible-lint ansible/site.yml
          uvx --from ansible-core ansible-playbook -i ansible/inventory ansible/site.yml --syntax-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run test -- --run --coverage --reporter=junit --outputFile=junit.xml
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  convex-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      convex_url: ${{ steps.deploy-preview.outputs.convex_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - name: Install Ansible
        run: pip install ansible
      - id: deploy-preview
        env:
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          export CONVEX_PREVIEW_NAME="pr-${{ github.event.pull_request.number }}"
          export REVIEW_SITE_URL="https://review-${{ github.event.pull_request.number }}.${{ secrets.DOMAIN_NAME }}"
          ansible-playbook -i ansible/inventory ansible/site.yml --tags "preview" -e "CONVEX_PREVIEW_NAME=$CONVEX_PREVIEW_NAME review_site_url=$REVIEW_SITE_URL"
          # Assuming the playbook or a script sets this up and we can extract the URL
          echo "convex_url=https://$CONVEX_PREVIEW_NAME.convex.site" >> $GITHUB_OUTPUT

  e2e-test:
    needs: convex-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          VITE_CONVEX_URL: ${{ needs.convex-preview.outputs.convex_url }}
          CONVEX_URL: ${{ needs.convex-preview.outputs.convex_url }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          CONVEX_PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
          PLAYWRIGHT_USE_PREVIEW: 'true'
        run: npx playwright test --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  build-image:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase REGISTRY_IMAGE
        run: echo "REGISTRY_IMAGE=$(echo ${{ env.REGISTRY_IMAGE }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Image Metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "version=PR-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "convex_url=https://pr-${{ github.event.pull_request.number }}.convex.site" >> $GITHUB_OUTPUT
            echo "site_url=https://review-${{ github.event.pull_request.number }}.${{ secrets.DOMAIN_NAME }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "convex_url=${{ secrets.CONVEX_SELF_HOSTED_URL || format('https://convex.{0}', secrets.DOMAIN_NAME) }}" >> $GITHUB_OUTPUT
            echo "site_url=https://${{ secrets.DOMAIN_NAME }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "version=v${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            echo "convex_url=${{ secrets.CONVEX_SELF_HOSTED_URL || format('https://convex.{0}', secrets.DOMAIN_NAME) }}" >> $GITHUB_OUTPUT
            echo "site_url=https://${{ secrets.DOMAIN_NAME }}" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_CONVEX_URL=${{ steps.meta.outputs.convex_url }}
            DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
            VITE_PLAUSIBLE_API_HOST=${{ secrets.VITE_PLAUSIBLE_API_HOST }}
            VITE_SITE_URL=${{ steps.meta.outputs.site_url }}
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase REGISTRY_IMAGE
        run: echo "REGISTRY_IMAGE=$(echo ${{ env.REGISTRY_IMAGE }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Install Ansible
        run: pip install ansible
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy to Production
        env:
          CONVEX_SELF_HOSTED_URL: ${{ secrets.CONVEX_SELF_HOSTED_URL }}
          CONVEX_SELF_HOSTED_ADMIN_KEY: ${{ secrets.CONVEX_SELF_HOSTED_ADMIN_KEY }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          ansible-playbook -i ansible/inventory ansible/site.yml --tags "deploy" \
            -e "ansible_host=${{ secrets.SSH_HOST }} \
                ansible_port=${{ secrets.SSH_PORT || 22 }} \
                ansible_user=${{ secrets.SSH_USER }} \
                IMAGE_TAG=$TAG_NAME \
                REGISTRY_URL=${{ env.REGISTRY_URL }} \
                REGISTRY_IMAGE=${{ env.REGISTRY_IMAGE }} \
                REGISTRY_USER=${{ github.actor }} \
                REGISTRY_PASSWORD=${{ secrets.GITHUB_TOKEN }}"

  deploy-review:
    if: github.event_name == 'pull_request'
    needs: [e2e-test, build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase REGISTRY_IMAGE
        run: echo "REGISTRY_IMAGE=$(echo ${{ env.REGISTRY_IMAGE }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Install Ansible
        run: pip install ansible
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy Review App
        run: |
          export SUBDOMAIN="review-${{ github.event.pull_request.number }}"
          export PR_ID="${{ github.event.pull_request.number }}"
          export IMAGE_TAG="${{ github.sha }}"
          export VITE_CONVEX_URL="${{ needs.convex-preview.outputs.convex_url }}"
          ansible-playbook -i ansible/inventory ansible/site.yml --tags "review" \
            -e "ansible_host=${{ secrets.SSH_HOST }} \
                ansible_port=${{ secrets.SSH_PORT || 22 }} \
                ansible_user=${{ secrets.SSH_USER }} \
                SUBDOMAIN=$SUBDOMAIN \
                PR_ID=$PR_ID \
                IMAGE_TAG=$IMAGE_TAG \
                VITE_CONVEX_URL=$VITE_CONVEX_URL \
                REGISTRY_URL=${{ env.REGISTRY_URL }} \
                REGISTRY_IMAGE=${{ env.REGISTRY_IMAGE }} \
                REGISTRY_USER=${{ github.actor }} \
                REGISTRY_PASSWORD=${{ secrets.GITHUB_TOKEN }}"
