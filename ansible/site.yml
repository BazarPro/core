---
# Production: backs up the database, then pulls and restarts the containers; the backend
# migrates the database on start.
- name: Deploy Application to Server
  hosts: production
  gather_facts: true
  tags: [prod, deploy]
  vars:
    ci_registry_image: "{{ REGISTRY_IMAGE | default(lookup('env', 'REGISTRY_IMAGE') | default('my-registry/my-app', true), true) }}"
    image_tag: "{{ IMAGE_TAG | default(lookup('env', 'IMAGE_TAG') | default('latest', true), true) }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('localhost', true) }}"
    cloudflare_dns_api_token: "{{ lookup('env', 'CLOUDFLARE_DNS_API_TOKEN') | default('', true) }}"
    postgres_password: "{{ lookup('env', 'POSTGRES_PASSWORD') }}"
    # Settings of the backend (backend/README.md), from the CI secrets
    backend_settings:
      ADMIN_EMAIL: "{{ lookup('env', 'ADMIN_EMAIL') }}"
      AUTH_SMTP_HOST: "{{ lookup('env', 'AUTH_SMTP_HOST') }}"
      AUTH_SMTP_PORT: "{{ lookup('env', 'AUTH_SMTP_PORT') }}"
      AUTH_SMTP_USER: "{{ lookup('env', 'AUTH_SMTP_USER') }}"
      AUTH_SMTP_PASS: "{{ lookup('env', 'AUTH_SMTP_PASS') }}"
      AUTH_SMTP_SECURE: "{{ lookup('env', 'AUTH_SMTP_SECURE') }}"
      AUTH_SMTP_STARTTLS: "{{ lookup('env', 'AUTH_SMTP_STARTTLS') }}"
      AUTH_SMTP_EHLO_HOST: "{{ lookup('env', 'AUTH_SMTP_EHLO_HOST') }}"
      AUTH_EMAIL_FROM: "{{ lookup('env', 'AUTH_EMAIL_FROM') }}"
      AUTH_GITHUB_ID: "{{ lookup('env', 'AUTH_GITHUB_ID') }}"
      AUTH_GITHUB_SECRET: "{{ lookup('env', 'AUTH_GITHUB_SECRET') }}"
      AUTH_GOOGLE_ID: "{{ lookup('env', 'AUTH_GOOGLE_ID') }}"
      AUTH_GOOGLE_SECRET: "{{ lookup('env', 'AUTH_GOOGLE_SECRET') }}"
    ci_registry: "{{ REGISTRY_URL | default(lookup('env', 'REGISTRY_URL') | default('docker.io', true), true) }}"
    ci_registry_user: "{{ REGISTRY_USER | default(lookup('env', 'REGISTRY_USER'), true) }}"
    ci_registry_password: "{{ REGISTRY_PASSWORD | default(lookup('env', 'REGISTRY_PASSWORD'), true) }}"
    remote_app_dir: '~/app'

  roles:
    - docker_deploy

- name: Deploy Review App
  hosts: production
  gather_facts: true
  tags: [review]
  vars:
    ci_registry_image: "{{ REGISTRY_IMAGE | default(lookup('env', 'REGISTRY_IMAGE') | default('my-registry/my-app', true), true) }}"
    image_tag: "{{ IMAGE_TAG | default(lookup('env', 'IMAGE_TAG') | default('latest', true), true) }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('localhost', true) }}"
    cloudflare_dns_api_token: "{{ lookup('env', 'CLOUDFLARE_DNS_API_TOKEN') | default('', true) }}"
    subdomain: "{{ lookup('env', 'SUBDOMAIN') }}"
    pr_id: "{{ lookup('env', 'PR_ID') }}"
    # platform or single; set explicitly, so removing the label switches back
    bazarpro_mode: "{{ BAZARPRO_MODE | default(lookup('env', 'BAZARPRO_MODE') | default('platform', true), true) }}"
    ci_registry: "{{ REGISTRY_URL | default(lookup('env', 'REGISTRY_URL') | default('docker.io', true), true) }}"
    ci_registry_user: "{{ REGISTRY_USER | default(lookup('env', 'REGISTRY_USER'), true) }}"
    ci_registry_password: "{{ REGISTRY_PASSWORD | default(lookup('env', 'REGISTRY_PASSWORD'), true) }}"
    # Password of the Mailpit inbox (user "review"); without it the inbox is not exposed
    review_mail_password: "{{ lookup('env', 'REVIEW_MAIL_PASSWORD') | default('', true) }}"
    remote_app_dir: '~/app'

  roles:
    - docker_review
