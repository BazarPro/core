---
- name: Ensure remote backup directory exists
  ansible.builtin.file:
    path: '{{ remote_app_dir }}/backups'
    state: directory
    mode: '0755'

- name: Ensure app directory exists
  ansible.builtin.file:
    path: '{{ remote_app_dir }}'
    state: directory
    mode: '0755'

- name: Copy Docker Compose files
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ remote_app_dir }}/{{ item | basename }}'
    mode: '0644'
  with_items:
    - '../docker-compose.yml'
    - '../traefik.yml'

- name: Ensure scripts directory exists
  ansible.builtin.file:
    path: '{{ remote_app_dir }}/scripts'
    state: directory
    mode: '0755'

- name: Copy the backup script
  ansible.builtin.copy:
    src: '../scripts/backup.sh'
    dest: '{{ remote_app_dir }}/scripts/backup.sh'
    mode: '0755'

- name: Copy Traefik dynamic configuration
  ansible.builtin.copy:
    src: '../config/'
    dest: '{{ remote_app_dir }}/config/'
    mode: '0644'
    directory_mode: '0755'

- name: Create .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: '{{ remote_app_dir }}/.env'
    mode: '0640'

- name: Create the backend settings from the CI secrets
  ansible.builtin.template:
    src: backend.env.j2
    dest: '{{ remote_app_dir }}/backend.env'
    mode: '0600'

# The new backend migrates the database when it starts: keep the state before
- name: Back up the database before the update
  ansible.builtin.shell: >-
    docker compose exec -T postgres pg_dump -U bazarpro --format=custom bazarpro
    > backups/predeploy_$(date +%Y-%m-%d_%H-%M-%S).dump
  args:
    chdir: '{{ remote_app_dir }}'
  register: docker_deploy_predeploy_backup
  changed_when: docker_deploy_predeploy_backup.rc == 0
  # The first deploy has no database yet
  failed_when: false

- name: Log into Docker Registry
  community.docker.docker_login:
    registry: '{{ ci_registry }}'
    username: '{{ ci_registry_user }}'
    password: '{{ ci_registry_password }}'
  when: ci_registry_user is defined and ci_registry_password is defined

- name: Ensure proxy network exists
  community.docker.docker_network:
    name: proxy
    state: present

- name: Pull and Start Docker Containers
  community.docker.docker_compose_v2:
    project_src: '{{ remote_app_dir }}'
    files:
      - docker-compose.yml
    state: present
    pull: always
