---
- name: Validate Self-hosted Convex configuration
  ansible.builtin.assert:
    that:
      - convex_cli_env.CONVEX_SELF_HOSTED_URL is defined
      - convex_cli_env.CONVEX_SELF_HOSTED_URL | length > 0
      - convex_cli_env.CONVEX_SELF_HOSTED_ADMIN_KEY is defined
      - convex_cli_env.CONVEX_SELF_HOSTED_ADMIN_KEY | length > 0
    fail_msg: >-
      Self-hosted Convex requires both CONVEX_SELF_HOSTED_URL and
      CONVEX_SELF_HOSTED_ADMIN_KEY in the environment before backup/deploy can run.

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: '{{ backup_dir }}'
    state: directory
    mode: '0755'

- name: Generate timestamp for backup
  ansible.builtin.set_fact:
    convex_timestamp: '{{ ansible_date_time.iso8601_basic_short }}'

- name: Wait for Convex backend to answer
  ansible.builtin.uri:
    url: '{{ convex_cli_env.CONVEX_SELF_HOSTED_URL }}/version'
    method: GET
    status_code: 200
    return_content: false
  register: convex_backend_health
  retries: 12
  delay: 10
  until: convex_backend_health.status == 200

- name: Backup Convex Data
  ansible.builtin.command: 'npx convex export --path {{ backup_dir }}/convex_backup_{{ convex_timestamp }}.zip'
  args:
    chdir: '{{ project_root }}'
  environment: '{{ convex_cli_env | default({}) }}'
  register: convex_backup_result
  changed_when: true
  retries: 6
  delay: 10
  until: convex_backup_result.rc == 0

- name: Set backup filename fact
  ansible.builtin.set_fact:
    convex_last_backup_file: '{{ backup_dir }}/convex_backup_{{ convex_timestamp }}.zip'
    cacheable: true

- name: Display backup location
  ansible.builtin.debug:
    msg: 'Convex backup saved to {{ backup_dir }}/convex_backup_{{ convex_timestamp }}.zip'

- name: Deploy Convex Backend
  ansible.builtin.command: "npx convex deploy --cmd 'npm run build'"
  args:
    chdir: '{{ project_root }}'
  environment: '{{ convex_cli_env | default({}) }}'
  register: convex_deploy_result
  changed_when: "'No changes' not in convex_deploy_result.stdout"
  retries: 6
  delay: 10
  until: convex_deploy_result.rc == 0
  when: convex_deploy_enabled | default(true) | bool
