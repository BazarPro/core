---
- name: Ensure base app directory exists
  ansible.builtin.file:
    path: '{{ remote_app_dir }}'
    state: directory
    mode: '0755'
  when: review_state | default('present') == 'present'

- name: Copy the base Docker Compose file
  ansible.builtin.copy:
    src: '../docker-compose.yml'
    dest: '{{ remote_app_dir }}/docker-compose.yml'
    mode: '0644'
  when: review_state | default('present') == 'present'

# Shared with production: whichever deploy changes the file restarts Traefik, the other
# one finds it unchanged
- name: Copy the Traefik configuration
  ansible.builtin.copy:
    src: '../traefik.yml'
    dest: '{{ remote_app_dir }}/traefik.yml'
    mode: '0644'
  notify: Restart Traefik
  when: review_state | default('present') == 'present'

- name: Copy Traefik dynamic configuration
  ansible.builtin.copy:
    src: '../config/'
    dest: '{{ remote_app_dir }}/config/'
    mode: '0644'
    directory_mode: '0755'
  when: review_state | default('present') == 'present'

- name: Create base .env file for infrastructure
  ansible.builtin.template:
    src: base.env.j2
    dest: '{{ remote_app_dir }}/.env'
    force: true
    mode: '0640'
  when: review_state | default('present') == 'present'

- name: Ensure Traefik is running for review routing
  community.docker.docker_compose_v2:
    project_src: '{{ remote_app_dir }}'
    files:
      - docker-compose.yml
    services:
      - traefik
    state: present
    pull: always
  when: review_state | default('present') == 'present'

- name: Handle Review App State
  block:
    - name: Ensure review app directory exists
      ansible.builtin.file:
        path: '{{ remote_app_dir }}/reviews/{{ pr_id }}'
        state: directory
        mode: '0755'
      when: review_state | default('present') == 'present'

    - name: Create docker-compose file for review app
      ansible.builtin.template:
        src: docker-compose.review.yml.j2
        dest: '{{ remote_app_dir }}/reviews/{{ pr_id }}/docker-compose.yml'
        force: true
        mode: '0644'
      when: review_state | default('present') == 'present'

    - name: Log into Docker Registry
      community.docker.docker_login:
        registry: '{{ ci_registry }}'
        username: '{{ ci_registry_user }}'
        password: '{{ ci_registry_password }}'
      when:
        - review_state | default('present') == 'present'
        - ci_registry_user is defined
        - ci_registry_password is defined

    - name: Ensure proxy network exists
      community.docker.docker_network:
        name: proxy
        state: present
      when: review_state | default('present') == 'present'

    # A PR may be closed without ever getting a review app (e.g. no pipeline ran for
    # it); there is nothing to stop then
    - name: Check for an existing review app
      ansible.builtin.stat:
        path: '{{ remote_app_dir }}/reviews/{{ pr_id }}/docker-compose.yml'
      register: docker_review_compose_file
      when: review_state | default('present') == 'absent'

    - name: Manage Review App Container
      when: review_state | default('present') == 'present' or docker_review_compose_file.stat.exists
      community.docker.docker_compose_v2:
        project_src: '{{ remote_app_dir }}/reviews/{{ pr_id }}'
        project_name: 'review-{{ pr_id }}'
        state: "{{ 'present' if (review_state | default('present') == 'present') else 'absent' }}"
        pull: "{{ 'always' if (review_state | default('present') == 'present') else omit }}"
        remove_volumes: true

    - name: Remove review app directory on stop
      ansible.builtin.file:
        path: '{{ remote_app_dir }}/reviews/{{ pr_id }}'
        state: absent
      when: review_state | default('present') == 'absent'
