services:
  backup:
    image: node:20-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ./data:/app
    working_dir: /app
    command: >
      sh -c "
      set -e &&
      : > /root/project_env.sh &&
      for var in CONVEX_DEPLOYMENT CONVEX_DEPLOY_KEY CONVEX_SELF_HOSTED_URL CONVEX_SELF_HOSTED_ADMIN_KEY VITE_CONVEX_URL VITE_CONVEX_SITE_URL; do
        val=$$(printenv \"$$var\" || true);
        if [ -n \"$$val\" ]; then
          printf \"%s='%s'\\n\" \"$$var\" \"$$val\" >> /root/project_env.sh;
        fi;
      done &&
      echo '* * * * * set -a; . /root/project_env.sh; set +a; /usr/local/bin/backup.sh > /proc/1/fd/1 2>&1' > /etc/crontabs/root &&
      crond -f -d 8
      "
