services:
  traefik:
    image: 'traefik:v3.6.11'
    restart: unless-stopped
    container_name: 'traefik'
    networks:
      default:
      proxy:
        ipv4_address: ${TRAEFIK_PROXY_NETWORK_IP:-172.18.0.100}
    ports:
      - '80:80'
      - '443:443'
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN:-}
      # Subdomains are CNAMEs to the upstream proxy; keep the DNS challenge in our own zone
      - LEGO_DISABLE_CNAME_SUPPORT=true
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml
      - ./config:/etc/traefik/config
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - './letsencrypt:/letsencrypt'

  frontend:
    image: ${CI_REGISTRY_IMAGE:-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - SITE_URL=https://${DOMAIN_NAME:-bazarpro.de}
      - BACKEND_URL=http://bazarpro-backend:3000
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.frontend-prod.rule=Host(`${DOMAIN_NAME:-bazarpro.de}`)'
      - 'traefik.http.routers.frontend-prod.entrypoints=websecure'
      - 'traefik.http.routers.frontend-prod.tls.certresolver=le'
      # One wildcard certificate (DNS challenge) also covers the review-<PR>
      # subdomains, so new review apps have valid TLS immediately.
      - 'traefik.http.routers.frontend-prod.tls.domains[0].main=${DOMAIN_NAME:-bazarpro.de}'
      - 'traefik.http.routers.frontend-prod.tls.domains[0].sans=*.${DOMAIN_NAME:-bazarpro.de}'
      - 'traefik.http.services.frontend-prod.loadbalancer.server.port=8080' # Node server (server/index.ts)
    networks:
      - default
      - proxy

  # Data, sign-in, live updates, uploads, emails and cron jobs (backend/). Answers under
  # the site's own domain at /api, so cookies stay first-party.
  backend:
    image: ${CI_REGISTRY_IMAGE:-frontend}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Each open page keeps a WebSocket; Docker's default of 1024 open files would refuse
    # connections from about 1000 visitors on
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Written by the production deploy; review deploys only start Traefik from this file
    env_file:
      - path: backend.env
        required: false
    environment:
      - DATABASE_URL=postgres://bazarpro:${POSTGRES_PASSWORD:-}@postgres:5432/bazarpro
      - SITE_URL=https://${DOMAIN_NAME:-bazarpro.de}
      - BAZARPRO_MODE=platform
      - RUST_LOG=${BACKEND_RUST_LOG:-info,sqlx=warn}
    volumes:
      - files:/data/files
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy'
      - 'traefik.http.routers.backend-prod.rule=Host(`${DOMAIN_NAME:-bazarpro.de}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.backend-prod.entrypoints=websecure'
      - 'traefik.http.routers.backend-prod.tls.certresolver=le'
      - 'traefik.http.services.backend-prod.loadbalancer.server.port=3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        # Unique name: the proxy network is shared with the review apps
        aliases:
          - bazarpro-backend
      proxy:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bazarpro
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=bazarpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bazarpro']
      interval: 5s
      timeout: 3s
      retries: 30

  # Nightly database dump and archive of the uploaded files, kept for 7 days
  # (scripts/backup.sh; restore with scripts/restore.sh)
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGUSER=bazarpro
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=bazarpro
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - files:/data/files:ro
    entrypoint:
      [
        'sh',
        '-c',
        "echo '30 3 * * * /usr/local/bin/backup.sh > /proc/1/fd/1 2>&1' > /etc/crontabs/root && crond -f -d 8",
      ]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    enable_ipv6: true
  proxy:
    name: proxy
    external: true

volumes:
  postgres_data:
  files:
