services:
  traefik:
    image: 'traefik:v3.6.6'
    container_name: 'traefik'
    security_opt:
      - no-new-privileges:true
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - '80:80'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - proxy

  frontend:
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
