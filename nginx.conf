server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Prerendered pages (dist/<route>/index.html), otherwise the neutral SPA
    # shell. Never fall back to index.html: it is the prerendered landing page
    # and would give every route the landing page's title and canonical.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /spa.html /index.html;
    }
}
