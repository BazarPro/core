[package]
name = "bazarpro-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
croner = "4.0.1"
futures = "0.3.34"
hex = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs", "builder", "smtp-transport", "hostname"] }
object_store = { version = "0.14.2", features = ["aws"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rust_decimal = { version = "1.43.0", features = ["serde-float"] }
scrypt = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal", "json", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "0.1.26"
urlencoding = "2.1.3"
uuid = { version = "1.28.0", features = ["v4", "serde", "v5"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Password hashing takes seconds unoptimized, which slows down the auth tests
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
