global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: :443
    proxyProtocol:
      trustedIPs:
        - 192.168.200.1/32
    http:
      tls:
        certResolver: le

log:
  level: INFO

api:
  dashboard: true

ping:
  manualRouting: true

providers:
  file:
    directory: /etc/traefik/config/
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: proxy

certificatesResolvers:
  le:
    acme:
      # ECDSA instead of Traefik's default RSA 4096: a TLS handshake with RSA 4096 cost
      # 7.4 ms CPU, so two cores managed only ~270 new connections per second
      keyType: EC256
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - '1.1.1.1:53'
          - '8.8.8.8:53'
        delayBeforeCheck: 30
      storage: /letsencrypt/acme.json
