<!doctype html><html lang="de"><head><meta charset="utf-8"><title>BazarPro – Logo</title><link rel="stylesheet" href="system.css">
<style>body{padding:40px;display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100vh}

.p .logo b{font-size:44px}.p .logo img{width:72px;height:72px}

<div class="p card"><span class="logo"><img src="logo.svg" alt=""><b>Bazar<span>Pro</span></b></span>

<div class="p" style="background:var(--petrol-900)"><span class="logo"><img src="logo-dark.svg" alt=""><b style="color:#fff">Bazar<span style="color:var(--tag-400)">Pro</span></b></span>
<div class="sw"><i style="background:#0e5e63"></i><i style="background:#f6c445"></i><i style="background:#d1452a"></i><i style="background:#2f7d32"></i><i style="background:#faf7f2"></i><i style="background:#1b2326"></i></div>
<small style="color:#a9cfcb">Petrol · Etikett-Gelb · Koralle · Blatt · Papier · Tinte</small></div>
</body></html>
