# BazarPro selbst hosten
#
#   cp .env.selfhost.example .env   # Domain, E-Mail und SMTP eintragen
#   docker compose -f docker-compose.selfhost.yml up -d
#
# Anleitung: https://docs.bazarpro.de/selbst-hosten/
#
# Benötigt einen DNS-Eintrag auf diesen Server (DOMAIN). Traefik holt das Zertifikat per
# HTTP-Challenge; /api geht an das Backend, alles andere an die App.
name: bazarpro

services:
  traefik:
    image: traefik:v3.6.11
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL in .env setzen}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  app:
    image: ghcr.io/bazarpro/core:${BAZARPRO_VERSION:?BAZARPRO_VERSION in .env setzen}
    restart: unless-stopped
    environment:
      SITE_URL: https://${DOMAIN:?DOMAIN in .env setzen}
      BACKEND_URL: http://backend:3000
      BAZARPRO_MODE: ${BAZARPRO_MODE:-single}
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
      PLAUSIBLE_API_HOST: ${PLAUSIBLE_API_HOST:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarpro.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.bazarpro.entrypoints=websecure
      - traefik.http.routers.bazarpro.tls.certresolver=le
      - traefik.http.services.bazarpro.loadbalancer.server.port=8080
    depends_on:
      backend:
        condition: service_healthy

  # Daten, Anmeldung, Live-Updates, Uploads und E-Mails. Befehle:
  #   docker compose -f docker-compose.selfhost.yml exec backend bazarpro-backend admin <email>
  #   docker compose -f docker-compose.selfhost.yml exec backend bazarpro-backend seed
  backend:
    image: ghcr.io/bazarpro/core/backend:${BAZARPRO_VERSION}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bazarpro:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@postgres:5432/bazarpro
      SITE_URL: https://${DOMAIN}
      BAZARPRO_MODE: ${BAZARPRO_MODE:-single}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-}
      AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-}
      AUTH_SMTP_USER: ${AUTH_SMTP_USER:-}
      AUTH_SMTP_PASS: ${AUTH_SMTP_PASS:-}
      AUTH_SMTP_SECURE: ${AUTH_SMTP_SECURE:-}
      AUTH_SMTP_STARTTLS: ${AUTH_SMTP_STARTTLS:-}
      AUTH_SMTP_EHLO_HOST: ${AUTH_SMTP_EHLO_HOST:-}
      AUTH_SMTP_TIMEOUT_MS: ${AUTH_SMTP_TIMEOUT_MS:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    volumes:
      - files:/data/files
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarpro-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.bazarpro-api.entrypoints=websecure
      - traefik.http.routers.bazarpro-api.tls.certresolver=le
      - traefik.http.services.bazarpro-api.loadbalancer.server.port=3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazarpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bazarpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bazarpro']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  letsencrypt:
  postgres_data:
  # Hochgeladene Fotos und Logos
  files:
